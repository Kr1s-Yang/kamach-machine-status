<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAMACH 登录</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f7fa;
      display: flex; align-items: center; justify-content: center;
    }
    .login-card {
      background: #fff; width: 92%; max-width: 420px;
      padding: 40px 34px 34px; border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.10); text-align: center;
    }
    .logo-wrap { display: inline-block; background: #e60012; padding: 18px 28px; border-radius: 12px; margin-bottom: 26px; }
    .logo-wrap img { max-width: 100%; width: 220px; display: block; }
    h1 { font-size: 22px; color: #1f2937; margin-bottom: 6px; letter-spacing: 1px; }
    .subtitle { font-size: 14px; color: #6b7280; margin-bottom: 28px; }
    .field { text-align: left; margin-bottom: 18px; }
    .field label { display: block; font-size: 13px; color: #374151; margin-bottom: 6px; font-weight: 500; }
    .field input { width: 100%; padding: 12px 14px; font-size: 15px; border: 1px solid #d1d5db; border-radius: 8px; outline: none; transition: border-color .2s, box-shadow .2s; }
    .field input:focus { border-color: #e60012; box-shadow: 0 0 0 3px rgba(230,0,18,0.10); }
    .btn { width: 100%; padding: 13px; margin-top: 8px; background: #e60012; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background .2s, transform .1s; }
    .btn:hover { background: #c7000f; }
    .btn:active { transform: translateY(1px); }
    .error { margin-top: 14px; color: #e60012; font-size: 13px; min-height: 18px; }
    .hint { margin-top: 22px; font-size: 12px; color: #9ca3af; line-height: 1.5; }
    .loader { display: none; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.6); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; vertical-align: middle; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 480px) { .login-card { padding: 32px 24px 28px; } .logo-wrap img { width: 180px; } h1 { font-size: 20px; } }
  </style>
</head>
